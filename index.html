<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>사람연습 | 동네생활 Alpha 1.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191d;color:#fff;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}button,input{font:inherit}button{cursor:pointer}#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#718d79}#scene{position:absolute;inset:0 0 70px;background:#7f947c url('assets/maps/town-map.png?map=20261110b') center/cover no-repeat}#scene.fallback{background-image:none;background-color:#81938a}#shade{position:absolute;inset:0;background:linear-gradient(#0005,transparent 22%,transparent 75%,#0006);pointer-events:none}.hud{position:absolute;z-index:4;background:#211f25e8;border:1px solid #caa673;box-shadow:0 4px 16px #0008;border-radius:14px;padding:9px 12px}.top{top:9px;left:9px;display:flex;gap:12px;align-items:center}.top b{font-size:16px}.stats{font-size:12px;color:#f3d2b4}.time{top:9px;left:50%;transform:translateX(-50%);font-weight:700;white-space:nowrap}.wallet{top:9px;right:12px;font-weight:800}.quest{top:88px;left:10px;font-size:12px;line-height:1.6;max-width:240px}.quest strong{color:#f4ce77}.spot{position:absolute;z-index:3;transform:translate(-50%,-50%);border:2px solid #e6c99a;border-radius:22px;background:#201d22ed;color:white;padding:7px 13px;font-weight:800;white-space:nowrap;box-shadow:0 3px 9px #0009;font-size:clamp(10px,1.2vw,16px)}.spot:focus,.spot:hover{background:#72503c;outline:2px solid #fff}.spot small{color:#f8c870}.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;align-items:stretch;justify-content:center;background:#232129f2;border-top:2px solid #c59c68;z-index:5}.bottom button{background:transparent;border:0;border-right:1px solid #ffffff22;color:#fff;min-width:85px;padding:6px 13px;font-size:12px}.bottom button span{display:block;font-size:24px}.bottom button:hover{background:#6b5142}.panelWrap{display:none;position:absolute;inset:0;z-index:9;background:#0e0c10aa;align-items:center;justify-content:center;padding:15px}.panelWrap.show{display:flex}.panel{width:min(850px,96vw);max-height:88dvh;overflow:auto;background:linear-gradient(135deg,#42342f,#242129);border:2px solid #d4b184;border-radius:18px;padding:22px;box-shadow:0 14px 50px #000b}.panel h2{margin:0 0 12px}.panel p{line-height:1.65}.panel button{border:1px solid #d3b38a;border-radius:11px;padding:10px 16px;margin:5px;background:#fff0d9;color:#302323;font-weight:700}.panel button.close{float:right;background:#594c4a;color:white}.panel input{padding:10px;border:2px solid #c7a376;border-radius:9px;max-width:180px;font-size:20px}.event{display:flex;gap:16px;align-items:stretch}.face{width:31%;min-width:120px;min-height:200px;border-radius:12px;background:linear-gradient(135deg,#e7c6b4,#9f7c73);display:grid;place-items:center;font-size:90px}.story{flex:1}.options{display:flex;flex-direction:column;gap:6px}.options button{text-align:left}.sub{color:#f0c993;font-size:13px}.sceneTitle{font-size:13px;color:#e7caad}.portraitOnly{display:none}.footerHint{position:absolute;right:12px;bottom:82px;z-index:4;background:#211f25c9;border:1px solid #bd9968;border-radius:12px;padding:8px 11px;font-size:12px}.rotate{display:none;position:absolute;inset:0;z-index:30;background:#16151a;align-items:center;justify-content:center;text-align:center;padding:25px}@media(orientation:portrait) and (max-width:800px){.rotate{display:flex}}@media(max-height:460px){.hud{padding:5px 9px}.top{top:5px}.time,.wallet{top:5px}.quest{top:58px}.bottom{height:53px}.bottom button span{font-size:17px}.bottom button{min-width:65px;font-size:10px}.spot{padding:5px 8px}.panel{padding:12px}.face{min-height:100px;font-size:60px}}
#mapStatus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;max-width:70vw;text-align:center;background:#27242de8;border:1px solid #e5b984;border-radius:12px;padding:12px 18px;font-size:13px}#scene.loaded~#mapStatus{display:none}.bottom{position:fixed!important;bottom:0!important;z-index:20!important}#scene{bottom:70px}#spots{position:absolute;inset:0 0 70px;pointer-events:none;z-index:3}#spots .spot{pointer-events:auto}.spot{font-size:clamp(10px,1.05vw,14px);padding:5px 10px}#scene.loaded{background-size:contain;background-color:#45564d}.quest{max-width:250px}.character-face{display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:0;background:#5c473f}.character-face img{display:block;width:100%;height:100%;min-height:220px;object-fit:cover;object-position:center 27%}.face-fallback{width:100%;height:100%;min-height:220px;place-items:center;font-size:76px}.event .story{min-width:0}.event .story p{font-size:clamp(14px,1.5vw,19px);line-height:1.6}.event .options button{width:100%;margin:4px 0}@media(max-height:460px){.character-face img,.face-fallback{min-height:140px;max-height:58dvh}.panel{max-height:92dvh}.event .story p{margin:8px 0}}
/* Full-screen visual novel cafe scene */
#wrap.cafe-mode{padding:0;align-items:stretch;justify-content:stretch;background:#151015;z-index:25}
#wrap.cafe-mode .panel{position:relative;width:100vw;max-width:none;max-height:none;height:100dvh;overflow:hidden;border:0;border-radius:0;padding:0;background:#3a302e;box-shadow:none}
#wrap.cafe-mode .panel>h2{position:absolute;z-index:5;top:15px;left:20px;margin:0;background:#241c1cce;border:1px solid #cba774;border-radius:12px;padding:10px 18px;font-size:clamp(14px,1.5vw,22px);text-shadow:0 2px 4px #000}
#wrap.cafe-mode .panel>.close{position:absolute;z-index:8;right:20px;top:14px;float:none;background:#211c20dc;color:#fff}
#wrap.cafe-mode .event{position:absolute;inset:0;display:block}
#wrap.cafe-mode .character-face{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;background:radial-gradient(circle at 50% 30%,#c8a486,#4a3532)}
#wrap.cafe-mode .character-face img{position:relative;z-index:1;display:block;width:100%;height:100%;min-height:0;max-height:none;object-fit:contain;object-position:center center;filter:saturate(1.04)}
#wrap.cafe-mode .character-face:before{content:"";position:absolute;inset:-24px;background-image:url('assets/characters/seoyoon/normal.png');background-position:center;background-size:cover;filter:blur(24px) brightness(.52);transform:scale(1.03)}
#wrap.cafe-mode .character-face:after{content:"";position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(to bottom,#0007 0%,transparent 20%,transparent 40%,#130d10b8 100%)}
#wrap.cafe-mode .face-fallback{height:100%;min-height:0}
#wrap.cafe-mode .story{position:absolute;z-index:3;left:2.5%;right:2.5%;bottom:4%;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,34%);grid-template-rows:auto auto;gap:10px 16px;align-items:end;pointer-events:none}
#wrap.cafe-mode .story>.sub{grid-column:1;grid-row:1;justify-self:start;align-self:end;padding:7px 18px;border:1px solid #d7b588;border-radius:14px;background:#31252be8;color:#ffdfb0;font-size:clamp(13px,1.2vw,18px);font-weight:800}
#wrap.cafe-mode .story>p{grid-column:1;grid-row:2;align-self:stretch;display:flex;align-items:center;margin:0;min-height:95px;padding:18px 23px;border:2px solid #d5b995;border-radius:16px;background:#fff1ddec;color:#352926;font-size:clamp(15px,1.65vw,24px);line-height:1.5;box-shadow:0 5px 25px #0009}
#wrap.cafe-mode .story>.options{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column;justify-content:end;gap:7px;pointer-events:auto}
#wrap.cafe-mode .options button{width:100%;margin:0;background:#fff3dfed;color:#342722;text-align:left;font-size:clamp(12px,1.12vw,17px);padding:12px 15px;border:2px solid #d1ac7c;border-radius:13px;box-shadow:0 3px 10px #0008;transition:background .15s,transform .15s}
#wrap.cafe-mode .options button:hover,#wrap.cafe-mode .options button:focus-visible{background:#fff;transform:translateY(-2px);outline:2px solid #f6d89d}
@media(max-height:520px){#wrap.cafe-mode .panel>h2{top:7px;left:10px;padding:6px 10px}#wrap.cafe-mode .panel>.close{top:7px;right:10px;padding:6px 10px}#wrap.cafe-mode .story{bottom:2%;gap:4px 8px}#wrap.cafe-mode .story>p{min-height:55px;padding:8px 13px;font-size:13px}#wrap.cafe-mode .story>.sub{padding:4px 10px;font-size:12px}#wrap.cafe-mode .options button{padding:7px 9px;font-size:11px}}
@media(max-width:650px) and (orientation:landscape){#wrap.cafe-mode .story{grid-template-columns:1fr 43%}#wrap.cafe-mode .story>p{font-size:12px}#wrap.cafe-mode .options button{font-size:10px}}

/* Alpha 1.5: 16:9 full-map frame, no cropping; hotspot coordinates follow map */
#app{--map-bottom:70px;--map-width:min(100vw,calc((100dvh - var(--map-bottom))*16/9));--map-height:min(calc(100dvh - var(--map-bottom)),calc(100vw*9/16));background:#45564d}
#scene,#spots{position:absolute!important;width:var(--map-width)!important;height:var(--map-height)!important;top:calc((100dvh - var(--map-bottom) - var(--map-height))/2)!important;left:50%!important;right:auto!important;bottom:auto!important;transform:translateX(-50%)!important}
#scene,#scene.loaded{background-position:center center!important;background-repeat:no-repeat!important;background-size:contain!important}
#spots{z-index:3;pointer-events:none}
#spots .spot{pointer-events:auto}
@media(max-height:460px){#app{--map-bottom:53px}}

/* Alpha 1.6: black letterboxing and visually distinct compact choices */
#app{background:#000!important}
#scene,#scene.loaded,#scene.fallback{background-color:#000!important}
#wrap.cafe-mode,#wrap.cafe-mode .panel,#wrap.cafe-mode .character-face{background:#000!important}
#wrap.cafe-mode .character-face:before{display:none!important}
#wrap.cafe-mode .story>p{background:rgba(255,244,221,.94)!important;color:#302821!important;border-color:#f0d7a9!important}
#wrap.cafe-mode .story>.options{gap:5px!important;align-items:stretch;justify-content:flex-end}
#wrap.cafe-mode .options button{background:rgba(40,42,57,.94)!important;color:#fff5e6!important;border:1px solid #b5a8c8!important;border-radius:9px!important;font-size:clamp(11px,.96vw,14px)!important;line-height:1.3!important;padding:8px 11px!important;min-height:0!important;box-shadow:0 2px 7px #0007!important}
#wrap.cafe-mode .options button:hover,#wrap.cafe-mode .options button:focus-visible{background:#545071!important;border-color:#f5dbac!important}
@media(max-height:520px){#wrap.cafe-mode .options button{padding:5px 8px!important;font-size:11px!important}#wrap.cafe-mode .story>p{min-height:45px!important;padding:9px 13px!important}}

/* Cafe has its own exit choice; hide redundant close control only in cafe */
#wrap.cafe-mode .panel>.close{display:none!important}

/* Alpha 2.4: late-arrival character scene and smooth travel transition */
#app:after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .52s ease;z-index:30}
#app:has(#scene.travel-fade):after{opacity:.94}
.late-office-event{display:flex;align-items:flex-end;justify-content:center;position:relative;min-height:min(58dvh,470px);overflow:hidden;background:linear-gradient(180deg,rgba(8,14,25,.2),rgba(8,14,25,.85)),url("assets/locations/office-interior.png") center/cover;border-radius:14px}
.late-office-event>img{max-height:min(58dvh,470px);max-width:60%;object-fit:contain;align-self:flex-end;filter:drop-shadow(0 5px 15px #0008)}
.late-office-dialog{background:rgba(17,22,33,.94);color:white;padding:14px 18px;border-radius:12px;max-width:48%;margin:0 12px 12px 0;align-self:flex-end}
.late-office-dialog p{font-size:clamp(14px,1.8vw,23px);font-weight:700;line-height:1.5}
.late-office-dialog .options button{font-size:clamp(11px,1.2vw,15px);padding:8px 12px}
@media(max-width:760px){.late-office-event{min-height:50dvh}.late-office-event>img{max-width:47%}.late-office-dialog{max-width:53%;padding:8px}.late-office-dialog p{font-size:13px}}

/* Alpha 3.2: readable, scrollable dialog above fixed navigation */
#wrap.panelWrap{z-index:20!important;box-sizing:border-box;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));overflow:hidden;align-items:center;justify-content:center}
#wrap:not(.cafe-mode) .panel{box-sizing:border-box;width:min(850px,calc(100vw - 28px));max-height:calc(100dvh - 24px - env(safe-area-inset-bottom,0px));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable;touch-action:pan-y;padding:clamp(12px,2vw,22px)}
#wrap:not(.cafe-mode) .panel .options{display:grid;grid-template-columns:minmax(0,1fr);gap:9px;align-items:stretch}
#wrap:not(.cafe-mode) .panel .options.two-column{grid-template-columns:repeat(2,minmax(0,1fr))}
#wrap:not(.cafe-mode) .panel .options button{min-width:0;width:100%;box-sizing:border-box;white-space:normal;overflow-wrap:anywhere;line-height:1.4;text-align:left}
@media(max-width:550px){#wrap:not(.cafe-mode) .panel .options.two-column{grid-template-columns:minmax(0,1fr)}}
@media(max-height:520px){#wrap.panelWrap{padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px))}#wrap:not(.cafe-mode) .panel{width:calc(100vw - 20px);max-height:calc(100dvh - 14px - env(safe-area-inset-bottom,0px));padding:12px 16px}#wrap:not(.cafe-mode) .panel .options{gap:7px}#wrap:not(.cafe-mode) .panel .options button{padding:9px 12px}}

/* Alpha 3.6: compact standard modal typography, readable item slots */
#wrap:not(.cafe-mode) .panel{font-size:clamp(12px,1.05vw,15px)!important;line-height:1.48}
#wrap:not(.cafe-mode) .panel>h2{font-size:clamp(17px,1.65vw,24px)!important;line-height:1.3;margin:0 0 12px}
#wrap:not(.cafe-mode) .panel>p{font-size:clamp(12px,1.05vw,15px)!important;line-height:1.55;margin:8px 0 14px;overflow-wrap:anywhere}
#wrap:not(.cafe-mode) .panel .options button{font-size:clamp(12px,1.06vw,15px)!important;padding:clamp(8px,1.15vw,12px) clamp(10px,1.25vw,15px)!important;line-height:1.35}
#wrap:not(.cafe-mode) .panel .inventory-info{font-size:clamp(12px,1.06vw,15px);margin:0 0 12px}
#wrap:not(.cafe-mode) .panel .inventory-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:8px 0 12px}
#wrap:not(.cafe-mode) .panel .inventory-slot{position:relative;min-width:0;aspect-ratio:1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#26232a;border:1px solid #9d8063;border-radius:8px;color:#f8ebd8;font-size:clamp(15px,2.2vw,25px);padding:5px;overflow:hidden}
#wrap:not(.cafe-mode) .panel .inventory-slot:disabled{opacity:.45;cursor:default}
#wrap:not(.cafe-mode) .panel .inventory-slot:not(:disabled):hover{border-color:#ffdd9b;background:#40352f}
#wrap:not(.cafe-mode) .panel .inventory-item-name{display:block;max-width:100%;font-size:clamp(9px,.85vw,12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#wrap:not(.cafe-mode) .panel .inventory-qty{position:absolute;right:3px;top:2px;font-size:10px;background:#655039;border-radius:4px;padding:1px 3px}
#wrap:not(.cafe-mode) .panel .inventory-hint{font-size:11px!important;color:#cbbda9}
@media(max-width:600px){#wrap:not(.cafe-mode) .panel .inventory-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}}
/* Alpha 3.8: closed dialogs must never intercept map touches */
#wrap.panelWrap:not(.show){display:none!important;pointer-events:none!important;visibility:hidden!important}
#wrap.panelWrap.show{display:flex;pointer-events:auto;visibility:visible}
#spots,#spots .spot{touch-action:manipulation}
</style></head><body><div id="app"><div id="scene" class="fallback"><div id="shade"></div></div><div id="mapStatus">🗺️ 마을 지도 이미지를 불러오는 중입니다.</div><div class="hud top"><div style="font-size:29px">👤</div><div><b id="player">이름 미설정</b><div class="stats">❤️ 체력 <span id="hp">100</span>　🍚 포만도 <span id="hunger">80</span>　🙂 기분 <span id="mood">60</span>　💗 호감 <span id="love">0</span></div></div></div><div class="hud time" id="clock"></div><div class="hud wallet" id="money"></div><div class="hud quest"><strong>❕ 메인 퀘스트</strong><div id="quest"></div></div><div id="spots"></div><div class="footerHint">📍 건물 이름을 눌러 방문하세요</div><div class="bottom"><button onclick="home()"><span>🏘️</span>동네</button><button onclick="spendTime()"><span>⏳</span>시간보내기</button><button onclick="phone()"><span>📱</span>휴대폰</button><button onclick="schedule()"><span>📅</span>일정</button><button onclick="people()"><span>💗</span>인물</button><button onclick="inventory()"><span>👜</span>가방</button><button onclick="journal()"><span>📒</span>기록</button><button onclick="save()"><span>💾</span>저장</button><button onclick="settings()"><span>⚙️</span>설정</button></div><div class="panelWrap" id="wrap"><div class="panel" id="panel"></div></div><div class="rotate">📱 휴대폰을 가로로 돌려주세요.</div></div><script src="game-map.js"></script></body></html>
