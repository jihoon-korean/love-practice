<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>사람연습 | 동네생활 Alpha 1.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191d;color:#fff;font-family:system-ui,'Apple SD Gothic Neo',sans-serif}button,input{font:inherit}button{cursor:pointer}#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#718d79}#scene{position:absolute;inset:0 0 70px;background:#7f947c url('assets/town-map.png') center/cover no-repeat}#scene.fallback{background-image:url('assets/town-art.svg');background-size:100% 100%}#shade{position:absolute;inset:0;background:linear-gradient(#0005,transparent 22%,transparent 75%,#0006);pointer-events:none}.hud{position:absolute;z-index:4;background:#211f25e8;border:1px solid #caa673;box-shadow:0 4px 16px #0008;border-radius:14px;padding:9px 12px}.top{top:9px;left:9px;display:flex;gap:12px;align-items:center}.top b{font-size:16px}.stats{font-size:12px;color:#f3d2b4}.time{top:9px;left:50%;transform:translateX(-50%);font-weight:700;white-space:nowrap}.wallet{top:9px;right:12px;font-weight:800}.quest{top:88px;left:10px;font-size:12px;line-height:1.6;max-width:240px}.quest strong{color:#f4ce77}.spot{position:absolute;z-index:3;transform:translate(-50%,-50%);border:2px solid #e6c99a;border-radius:22px;background:#201d22ed;color:white;padding:7px 13px;font-weight:800;white-space:nowrap;box-shadow:0 3px 9px #0009;font-size:clamp(10px,1.2vw,16px)}.spot:focus,.spot:hover{background:#72503c;outline:2px solid #fff}.spot small{color:#f8c870}.bottom{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;align-items:stretch;justify-content:center;background:#232129f2;border-top:2px solid #c59c68;z-index:5}.bottom button{background:transparent;border:0;border-right:1px solid #ffffff22;color:#fff;min-width:85px;padding:6px 13px;font-size:12px}.bottom button span{display:block;font-size:24px}.bottom button:hover{background:#6b5142}.panelWrap{display:none;position:absolute;inset:0;z-index:9;background:#0e0c10aa;align-items:center;justify-content:center;padding:15px}.panelWrap.show{display:flex}.panel{width:min(850px,96vw);max-height:88dvh;overflow:auto;background:linear-gradient(135deg,#42342f,#242129);border:2px solid #d4b184;border-radius:18px;padding:22px;box-shadow:0 14px 50px #000b}.panel h2{margin:0 0 12px}.panel p{line-height:1.65}.panel button{border:1px solid #d3b38a;border-radius:11px;padding:10px 16px;margin:5px;background:#fff0d9;color:#302323;font-weight:700}.panel button.close{float:right;background:#594c4a;color:white}.panel input{padding:10px;border:2px solid #c7a376;border-radius:9px;max-width:180px;font-size:20px}.event{display:flex;gap:16px;align-items:stretch}.face{width:31%;min-width:120px;min-height:200px;border-radius:12px;background:linear-gradient(135deg,#e7c6b4,#9f7c73);display:grid;place-items:center;font-size:90px}.story{flex:1}.options{display:flex;flex-direction:column;gap:6px}.options button{text-align:left}.sub{color:#f0c993;font-size:13px}.sceneTitle{font-size:13px;color:#e7caad}.portraitOnly{display:none}.footerHint{position:absolute;right:12px;bottom:82px;z-index:4;background:#211f25c9;border:1px solid #bd9968;border-radius:12px;padding:8px 11px;font-size:12px}.rotate{display:none;position:absolute;inset:0;z-index:30;background:#16151a;align-items:center;justify-content:center;text-align:center;padding:25px}@media(orientation:portrait) and (max-width:800px){.rotate{display:flex}}@media(max-height:460px){.hud{padding:5px 9px}.top{top:5px}.time,.wallet{top:5px}.quest{top:58px}.bottom{height:53px}.bottom button span{font-size:17px}.bottom button{min-width:65px;font-size:10px}.spot{padding:5px 8px}.panel{padding:12px}.face{min-height:100px;font-size:60px}}
